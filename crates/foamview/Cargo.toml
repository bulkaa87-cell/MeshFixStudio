[package]
name = "foamview"
version = "0.2.0"
edition = "2024"
description = "3D view for triangle meshes and CFD results: wgpu (GPU or software adapter) with a CPU renderer"
publish = false
license.workspace = true
repository.workspace = true

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive", "min_const_generics"] }
fontdue = "0.9.5"
numpy = "0.30"
pollster = "1.0.1"
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }
raw-window-handle = "0.6.2"
rayon = "1"
wgpu = "30.0.1"

[lib]
name = "foamview"
crate-type = ["cdylib", "rlib"]
