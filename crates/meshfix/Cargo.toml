[package]
name = "meshfix"
version = "0.1.0"
edition = "2021"
description = "Repair of triangle surface meshes: the steps of the Windows 3D-print repair, and the geometry check"
publish = false
license.workspace = true
repository.workspace = true

[lib]
name = "meshfix"
crate-type = ["cdylib", "rlib"]

# The Python module is a feature, so that `cargo test --no-default-features`
# can link the tests without Python.
[features]
default = ["python"]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
robust = "1"
spade = "2"
rayon = "1"
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"], optional = true }
numpy = { version = "0.30", optional = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(meshfix_debug)"] }
