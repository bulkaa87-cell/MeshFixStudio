# Build, test and package MeshFix Studio on Windows, macOS and Linux.
#
# Each push and pull request: the Rust tests, the native wheels, the tests
# of the core and of the window (off-screen, software rendering), the
# PyInstaller program, the test of the built program, and the installers
# as workflow artifacts (kept 14 days).
# A tag v* (for example v0.1.0): the same, then a GitHub Release with the
# installers and the wheels. OpenFOAM Studio pins the wheels of a release.

name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust tests (meshfix crate)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release -p meshfix --no-default-features

  build:
    name: ${{ matrix.name }}
    needs: rust
    permissions:
      contents: read
      # Build provenance attestations (free, no application needed).
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: windows
            arch: x64
          - name: Linux x86_64
            os: ubuntu-22.04
            target: linux
            arch: x86_64
          - name: macOS arm64
            os: macos-15
            target: macos
            arch: arm64
          - name: macOS x86_64
            os: macos-15-intel
            target: macos
            arch: x86_64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: offscreen
      # Software rendering on the runners: WARP (Windows), lavapipe and
      # llvmpipe (Linux). The view falls back to VTK and to the CPU renderer.
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Linux packages (Qt, Mesa llvmpipe and lavapipe, Xvfb)
        if: matrix.target == 'linux'
        # PySide6 needs libEGL: without these packages no test can run.
        # The Ubuntu mirrors did not answer some runners (2026-11-11 and
        # 2026-11-12): try one mirror after the other, each with a limit.
        timeout-minutes: 25
        run: |
          PKGS="libegl1 libgl1 libgl1-mesa-dri mesa-vulkan-drivers libvulkan1
            libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libfontconfig1
            libdbus-1-3 libxrender1 libxi6 libsm6 xvfb fonts-dejavu-core"
          APT="-o Acquire::Retries=2 -o Acquire::http::Timeout=20"
          for m in http://archive.ubuntu.com/ubuntu/ \
                   http://mirrors.edge.kernel.org/ubuntu/ \
                   http://azure.archive.ubuntu.com/ubuntu/ \
                   http://mirror.math.princeton.edu/pub/ubuntu/ \
                   http://ftp.halifax.rwth-aachen.de/ubuntu/; do
            echo "== mirror $m"
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              printf '%s\n' "$m" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            else
              sudo sed -i -E "s#http://[^ ]+/ubuntu/?#${m%/}#g" /etc/apt/sources.list
            fi
            if sudo timeout 180 apt-get $APT update &&
               sudo timeout 300 apt-get install -y --no-install-recommends $APT $PKGS; then
              exit 0
            fi
          done
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Python tools
        run: python -m pip install --upgrade pip maturin pyinstaller pillow

      - name: Native wheels (meshfix-core, foamview)
        run: |
          python -m maturin build --release -m crates/meshfix/Cargo.toml -o wheels
          python -m maturin build --release -m crates/foamview/Cargo.toml -o wheels

      - name: Install the wheels and the dependencies
        run: |
          python -m pip install wheels/*.whl
          python -m pip install six
          if [ "${{ matrix.target }}" = "windows" ]; then
            python -m pip install "winrt-Windows.Graphics.Printing3D>=3.2" "winrt-Windows.Storage.Streams>=3.2"
          fi

      - name: Test the core
        run: python -X utf8 tests/test_core.py

      - name: Test the window (off-screen)
        run: python -X utf8 tests/test_app.py

      - name: Icons
        run: python packaging/icons/make_icons.py

      - name: PyInstaller program
        run: python -m PyInstaller --noconfirm --distpath dist --workpath build/pyi packaging/pyinstaller/meshfix_studio.spec

      - name: Test the built program (Windows)
        if: matrix.target == 'windows'
        env:
          QT_QPA_PLATFORM: ""
        run: python -X utf8 tests/test_built_app.py "dist/MeshFix Studio/MeshFix Studio.exe"

      - name: Test the built program (Linux, Xvfb if the packages are there)
        if: matrix.target == 'linux'
        run: |
          if command -v xvfb-run >/dev/null && dpkg -s libxcb-cursor0 >/dev/null 2>&1; then
            QT_QPA_PLATFORM=xcb xvfb-run -a python -X utf8 tests/test_built_app.py "dist/MeshFix Studio/MeshFix Studio"
          else
            echo "No Xvfb or no libxcb-cursor0: test with the offscreen platform"
            python -X utf8 tests/test_built_app.py "dist/MeshFix Studio/MeshFix Studio"
          fi

      - name: Test the built program (macOS)
        if: matrix.target == 'macos'
        run: python -X utf8 tests/test_built_app.py "dist/MeshFix Studio.app/Contents/MacOS/MeshFix Studio"

      - name: Version
        id: version
        run: |
          v=$(python -c "import re,io;print(re.search(r'^version\s*=\s*\"([^\"]+)\"', io.open('crates/meshfix/Cargo.toml',encoding='utf-8').read(), re.M).group(1))")
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Windows installer (Inno Setup)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y; }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" packaging\windows\meshfix_studio.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: macOS disk image
        if: matrix.target == 'macos'
        run: sh packaging/macos/make_dmg.sh "${{ steps.version.outputs.version }}" "${{ matrix.arch }}"

      - name: Linux AppImage
        if: matrix.target == 'linux'
        run: sh packaging/linux/make_appimage.sh "${{ steps.version.outputs.version }}"

      - name: Build provenance attestation (installer and wheels)
        # A pull request from a fork gets no id-token: skip it there.
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            wheels/*.whl

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: error
          retention-days: 14

      - name: Upload the wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}-${{ matrix.arch }}
          path: wheels/*.whl
          retention-days: 14

  release:
    name: GitHub Release
    # Also when a row of the matrix failed: the release then has the
    # installers of the rows that passed, and its notes name the missing
    # systems. Not when the run was cancelled.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Release notes and the list of files
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.whl' \) -exec cp {} release/ \;
          ls -l release
          (cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          cp RELEASE_NOTES.md notes.md
          missing=""
          ls release/*windows-x64-setup.exe >/dev/null 2>&1 || missing="$missing Windows x64,"
          ls release/*macos-arm64.dmg >/dev/null 2>&1 || missing="$missing macOS arm64,"
          ls release/*macos-x86_64.dmg >/dev/null 2>&1 || missing="$missing macOS x86_64,"
          ls release/*linux-x86_64.AppImage >/dev/null 2>&1 || missing="$missing Linux x86_64,"
          if [ -n "$missing" ]; then
            printf '\n## Not in this release\n\nThe build of these systems failed:%s. They come in a later release.\n' "${missing%,}" >> notes.md
          fi
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          body_path: notes.md
          fail_on_unmatched_files: false
          files: release/*
