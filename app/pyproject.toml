[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "meshfix-studio"
dynamic = ["version"]
description = "MeshFix Studio: open a triangle mesh, see its problems in 3D, repair it, export STL"
readme = "../README.md"
license = { text = "GPL-3.0-only" }
requires-python = ">=3.10"
dependencies = [
    "meshfix-core",
    "foamview",
    "numpy>=1.26",
    "PySide6>=6.7",
    "pyvista>=0.44",
    "pyvistaqt>=0.11",
    "vtk>=9.3",
    "six",
]

[project.optional-dependencies]
windows = ["meshfix-core[windows]"]

[project.gui-scripts]
meshfix-studio = "meshfix_studio.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "meshfix_studio.__version__" }

[tool.setuptools.packages.find]
include = ["meshfix_studio*"]

[tool.setuptools.package-data]
meshfix_studio = ["i18n/*/*.json"]
